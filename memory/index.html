<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="JS/App.js"></script>
    <link href="CSS/style.css" rel="stylesheet"/>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <title>Memory</title>
</head>
<body>
    <main id="window">
        <section id="ai-game">
            <div id="ai-game-board">
            </div>
            <div id="ai-game-info">
                <p>Time : <span id="ai-timer">00:00</span></p>
                <p id="ai-result"></p>
            </div>
        </section>
        <section id="game">
            <div id="game-board">
            </div>
            <div id="game-info">
                <p>Time : <span id="timer">00:00</span></p>
                <p id="result"></p>
                <button id="reset-btn" type="button">Restart</button>
            </div>
        </section>
    </main>
</body>
</html>
