<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="../favicon.png" />
    <title>ShiFuMi</title>

    <script defer src="App.js"></script>
</head>

<body>
    <h1>shifumi</h1>

    <main id="game">
        <div id="play_buttons">
            <button class="btn" data-move="rock" type="button">
                rock
            </button>

            <button class="btn" data-move="paper" type="button">
                paper
            </button>

            <button class="btn" data-move="scissors" type="button">
                scisors
            </button>
        </div>

        <p id="result" aria-live="polite"></p>

        <div id="stats">
            <p>victories : <span class="stat" id="victories">0</span></p>
            <p>defeats : <span class="stat" id="defeats">0</span></p>
            <p>nulls : <span class="stat" id="nulls">0</span></p>
        </div>

        <div id="control_buttons">
            <button class="reset" id="reset" type="button">
                    reset
            </button>
            <a href="../index.html" class="btn">return</a>
        </div>
    </main>
</body>
</html>
